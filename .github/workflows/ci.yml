name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cli:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test
      - name: Test shared Skill installer in a temporary home
        run: ./scripts/test-install-skill-user.sh
      - name: Build and verify universal local installer
        run: SKIP_SIGNING=true ./scripts/build-pkg.sh
      - name: Check version and command help
        run: |
          test "$(dist/bin/cpsm version)" = "cpsm $(cat VERSION)"
          dist/bin/cpsm help
          lipo dist/bin/cpsm -verify_arch arm64 x86_64
          zsh -n scripts/build-pkg.sh
          zsh -n scripts/notarize-pkg.sh
          zsh -n scripts/build-tools-pkg.sh
          zsh -n scripts/notarize-tools-pkg.sh
